name: Apply Chams Render Passes

on:
  push:
    branches: [chams-render-passes]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chams-render-passes
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply focused source patch
        run: python tools/apply_chams_patch.py
      - name: Commit generated source change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/src/dllmain.cpp
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Implement chams render passes"
          git push origin HEAD:chams-render-passes
