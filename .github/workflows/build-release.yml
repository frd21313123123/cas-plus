name: Build DLL and EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dll:
    name: Build DLL (Release x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DLL
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\dll'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild '.\payload\PotatoPayload.vcxproj' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal `
            "/p:OutDir=$out\"

          if ($LASTEXITCODE -ne 0) {
            throw "DLL build failed with exit code $LASTEXITCODE."
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll-x64
          path: artifacts/dll/*.dll
          if-no-files-found: error
          retention-days: 14

  build-exe:
    name: Build EXE (Release x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\exe'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild '.\injector\potatoInjector.vcxproj' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal `
            "/p:OutDir=$out\"

          if ($LASTEXITCODE -ne 0) {
            throw "EXE build failed with exit code $LASTEXITCODE."
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-x64
          path: artifacts/exe/*.exe
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Windows x64
    needs: [build-dll, build-exe]
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: windows-dll-x64
          path: package/dll

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-x64
          path: package

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.\dist' -Force | Out-Null
          Compress-Archive `
            -Path '.\package\*' `
            -DestinationPath '.\dist\windows-x64.zip' `
            -CompressionLevel Optimal `
            -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: dist/windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-package
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            '.\dist\windows-x64.zip' `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes
