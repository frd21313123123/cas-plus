name: Build DLL and EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Custom release tag (e.g. v1.1.2 or latest)
        required: false
        default: 'latest'
        type: string

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dll:
    name: Build DLL (Release x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DLL
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\dll'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild '.\payload\PotatoPayload.vcxproj' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal `
            "/p:OutDir=$out\"

          if ($LASTEXITCODE -ne 0) {
            throw "DLL build failed with exit code $LASTEXITCODE."
          }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll-x64
          path: artifacts/dll/*.dll
          if-no-files-found: error
          retention-days: 14

  build-exe:
    name: Build EXE (Release x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build EXE
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\exe'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild '.\injector\potatoInjector.vcxproj' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal `
            "/p:OutDir=$out\"

          if ($LASTEXITCODE -ne 0) {
            throw "EXE build failed with exit code $LASTEXITCODE."
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-x64
          path: artifacts/exe/*.exe
          if-no-files-found: error
          retention-days: 14

  build-loader:
    name: Build Loader (Release x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Loader
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\loader'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          msbuild '.\loader\Loader.vcxproj' `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal `
            "/p:OutDir=$out\"

          if ($LASTEXITCODE -ne 0) {
            throw "Loader build failed with exit code $LASTEXITCODE."
          }

      - name: Upload Loader artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-x64
          path: artifacts/loader/*.exe
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Windows x64
    needs: [build-dll, build-exe, build-loader]
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: windows-dll-x64
          path: package/dlls

      - name: Download Injector EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-x64
          path: package

      - name: Download Loader EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-loader-x64
          path: package

      - name: Create ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path '.\dist' -Force | Out-Null
          Compress-Archive `
            -Path '.\package\*' `
            -DestinationPath '.\dist\windows-x64.zip' `
            -CompressionLevel Optimal `
            -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: dist/windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: windows-x64-package
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $inputTag = "${{ inputs.release_tag }}"
          $tag = if ($inputTag -and $inputTag.Trim() -ne "") {
            $inputTag.Trim()
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            "${{ github.ref_name }}"
          } else {
            "latest"
          }

          Write-Host "Publishing release with tag: $tag"

          if ($tag -eq "latest") {
            gh release delete "latest" --yes --cleanup-tag --repo "${{ github.repository }}" 2>$null
          }

          gh release create "$tag" `
            '.\dist\windows-x64.zip' `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "cas+ $tag" `
            --notes "Automated build of DLL and Injector from commit ${{ github.sha }}"
