name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag, for example v1.0.1
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cas-plus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build x64 package
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path artifacts/package/* -DestinationPath dist/cas-plus-windows-x64.zip -CompressionLevel Optimal

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cas-plus-windows-x64
          path: artifacts/package
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/cas-plus-windows-x64.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "cas+ $env:RELEASE_TAG" --generate-notes
